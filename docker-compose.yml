name: biscotos

services:
  # Passkey auth + per-user data (Node, no framework).
  # Biscotos is always built from this repository (pull_policy: build): the prebuilt openGym
  # images on ghcr.io are not this code, and the web one carries the licensed exercise media.
  api:
    image: biscotos-api:local
    pull_policy: build
    # Default target: no AI runtime, no AI dependency — the image every instance has always had.
    # To opt into the AI Coach, build the other target instead:
    #     API_TARGET=coach docker compose up --build api
    # `--build` matters: with an `image:` also set, compose would otherwise pull the prebuilt
    # default rather than build the coach one.
    build:
      context: ./api
      target: ${API_TARGET:-default}
    restart: unless-stopped
    env_file:                  # 👈 .env devient facultatif (il n'existe pas sur GitHub)
      - path: .env
        required: false
    environment:
      # The port the API listens on. web proxies to this same value, so the two
      # cannot drift — change it in .env and both follow.
      - PORT=${PORT:-3000}
      - DATA_DIR=/data
      # The API is reachable only through the web container here, and that container overwrites
      # X-Forwarded-For / X-Real-IP with the real peer — so the sign-in throttle may count
      # requests by those headers instead of lumping everyone in as "the web container".
      - TRUST_PROXY=${TRUST_PROXY:-1}
      # Réglages du déploiement. Portainer (stack Git) n'a pas de fichier .env : ses « Environment
      # variables » ne servent qu'à remplir les ${…} d'ici, donc elles doivent être listées pour
      # arriver dans le conteneur. Vide = non défini (l'API retombe sur ses valeurs par défaut) ;
      # avec un .env ça marche pareil. Aucune valeur réelle ici : domaine et réglages vont dans
      # Portainer ou dans .env (docs/DEPLOY_HOMELAB.md).
      - RP_ID=${RP_ID:-}
      - ORIGIN=${ORIGIN:-}
      - RP_NAME=${RP_NAME:-}
      - DEFAULT_LANG=${DEFAULT_LANG:-}
      - FIRST_USER_ADMIN=${FIRST_USER_ADMIN:-}
      - INVITE_ONLY=${INVITE_ONLY:-}
      - ALLOW_GUEST=${ALLOW_GUEST:-}
      - ADMIN_UIDS=${ADMIN_UIDS:-}
      - SESSION_DAYS=${SESSION_DAYS:-}
      - TZ=${TZ:-}
      # 👇 Une autre variable de .env dont l'app a besoin ? Ajoute-la ici :
      # - NOM_VARIABLE=${NOM_VARIABLE:-}
    volumes:
      # 👈 volumes nommés au lieu de ./data et ./coach-auth (les chemins relatifs
      #    ne marchent pas avec les stacks Git de Portainer)
      - data:/data           # users, passkeys, per-user state, session secret — BACK THIS UP
                             # (and uploads/: the photos and videos of custom exercises)
      # Provider credential cache (Codex). Nothing here needs backing up —
      # if you lose it, sign the provider in again.
      - coach-auth:/coach-auth

  # Builds the React frontend (multi-stage) and serves it, proxying /api → api
  # and the exercise animations, which are part of the image. Single origin for passkeys.
  web:
    image: biscotos-web:local
    pull_policy: build
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Exercise stills/animations: licensed to openGym only (docs/QUESTIONS.md Q4). Off unless
        # you hold your own licence from gymvisual.com.
        EXERCISE_MEDIA: ${EXERCISE_MEDIA:-0}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    networks:                  # 👈 seul `web` rejoint le réseau du tunnel, pas `api`
      default:
      web:
        aliases:
          - biscotos           # 👈 nom utilisé par Cloudflare : http://biscotos:80
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:${NGINX_PORT:-80}"   # 👈 plus exposé sur tout le LAN
    # nginx renders its config at start-up from these (web/nginx.conf.template),
    # so the API service does not have to be called `api`. Defaults are the old
    # hardcoded values, so an existing .env and an existing stack are unaffected.
    environment:
      - NGINX_PORT=${NGINX_PORT:-80}
      - BACKEND=${BACKEND:-api}
      - PORT=${PORT:-3000}
      # Docker's embedded DNS. Only ever needs changing on a runtime that is not Docker.
      - RESOLVER=${RESOLVER:-127.0.0.11}
      # Empty drops the CF-Connecting-IP header, so a direct client cannot forge the address
      # the activity log records. Cloudflare users set CF_CONNECTING_IP=$$http_cf_connecting_ip.
      - CF_CONNECTING_IP=${CF_CONNECTING_IP:-}
      # Subpath deployments behind a proxy that passes its prefix through ("/gym", no trailing
      # slash). Empty serves the app at the site root, which is what it has always done; a proxy
      # that strips the prefix needs nothing set (docs/SELF_HOSTING.md §5).
      - BASE_PATH=${BASE_PATH:-}
      # The largest photo or video upload nginx passes to the API. Keep it above
      # MEDIA_VIDEO_MAX_MB (40 by default), which the api service reads from .env.
      - MEDIA_UPLOAD_MAX=${MEDIA_UPLOAD_MAX:-48m}

volumes:                       # 👈 ajout
  data:
  coach-auth:

networks:                      # 👈 ajout
  web:
    external: true